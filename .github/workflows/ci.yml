name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install SDK
        run: cd sdk-java && mvn -B install
      - name: Backend compile + test (includes ArchUnit)
        run: cd backend && mvn -B verify
      - name: Demo app compile
        run: cd demo-app && mvn -B compile
      - name: Demo worker compile
        run: cd demo-worker && mvn -B compile

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd infrastructure && npm ci
      - run: cd infrastructure && npm run build
      - run: cd infrastructure && npx cdk synth --all
